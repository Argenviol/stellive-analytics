# 수집이 끝나면(collect-community) 분석을 다시 돌려 analysis/out/ 을 갱신한다. 매주 일요일에도 돈다(치지직 전체 시계열 반영).
# 분석은 수집하지 않는다 — collect/data 와 01~08·12 의 data/ 만 읽는다. API 키 불필요.

name: analyze-community

on:
  workflow_run:
    workflows: [collect-community]
    types: [completed]
  schedule:
    - cron: "0 0 * * 0" # 매주 일요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analyze-community
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: youtube_analyze_all
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube_analyze_all/requirements.txt

      - run: pip install -r requirements.txt

      # 스텔 DB 이용 집계 — 비밀값(STELDB_SUPABASE_URL·KEY)이 없으면 지난 스냅샷을 그대로 쓴다.
      - name: 스텔 DB 이용 집계
        env:
          STELDB_SUPABASE_URL: ${{ secrets.STELDB_SUPABASE_URL }}
          STELDB_SUPABASE_KEY: ${{ secrets.STELDB_SUPABASE_KEY }}
        run: python collect/steldb_usage.py || echo "::warning::스텔 DB 집계 실패 — 지난 스냅샷 사용"

      # 하나가 실패해도 나머지는 돌린다 — 실패는 잡을 빨갛게 남긴다.
      - name: 분석
        run: |
          rc=0
          for s in origin_of_viewers dc_reaction hypotheses shorts_formats shorts_first_movers cover_reaction cover_watch steldb_usage; do
            python analysis/$s.py > /dev/null || { echo "::error::$s 실패"; rc=1; }
          done
          exit $rc

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A analysis/out collect/data/steldb_usage.json
          git diff --staged --quiet || git commit -m "chore: 분석 결과 갱신 $(date -u +%Y-%m-%d)"
          for try in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            echo "push 재시도 $try"
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
